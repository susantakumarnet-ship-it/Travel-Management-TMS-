# Replace royalride.example with your domain. Obtain certificates first:
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d royalride.example -d www.royalride.example

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

server {
  listen 80;
  server_name royalride.example www.royalride.example;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://royalride.example$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name royalride.example www.royalride.example;

  ssl_certificate     /etc/letsencrypt/live/royalride.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/royalride.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 20m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Payment gateway webhooks go straight to the API (raw body preserved).
  location /api/webhooks/ { proxy_pass http://api:4000; }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api:4000;
  }
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api:4000;
  }
  location /uploads/public/ {
    proxy_pass http://api:4000;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location /health { proxy_pass http://api:4000; }

  location / { proxy_pass http://web:3000; }
}
