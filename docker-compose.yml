# Production-style stack: API + Web + Nginx (TLS). Database is MongoDB Atlas (managed, with
# Atlas continuous backups / point-in-time restore — enable "Cloud Backup" on an M10+ cluster).
# Usage:
#   cp deploy/.env.production.example deploy/.env.production   # fill in DATABASE_URL + secrets
#   docker compose --env-file deploy/.env.production up -d --build
#   docker compose exec api npx tsx prisma/seed.ts               # optional demo data (dev/staging only)

services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: deploy/.env.production
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/api/uploads
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL:-https://royalride.example}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${APP_URL:-https://royalride.example}
    depends_on: [api]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on: [web, api]
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks: [internal]

volumes:
  uploads:
  certbot-www:

networks:
  internal:
